# ============================================================================
#  NICHE FINDER — configuration
#  Everything the scanner needs is here. Edit this file, not the code.
#  The niche library below was built from live research (Aug 2026): real
#  buyer-intent keywords, national CPC, job value, saturation, and a verdict.
# ============================================================================

# --- Sales reps (populate the "Assign to a rep" dropdown in No-Site Finder) ---
# Each name MUST match the name that rep logs into the Rep Portal with, so their
# assigned leads route to the right person. You can also type a name on the fly.
reps:
  - Ben

settings:
  # --- City universe (Gate B geography) ---
  population_min: 15000        # floor: 15k so small satellite towns (Hurricane UT) qualify
  population_max: 400000       # ceiling: above this the big-city field is too strong to rank cheaply

  # --- Gate A: niche qualifier — TICKET-BASED (your $1k+ rule) ---
  min_job_value: 1000          # a niche qualifies if its jobs can reach this (uses the HIGH end of its range).
                               # You qualify individual jobs at the sales level; anything $1k+ is worth working.
  min_national_cpc: 5.0        # informational only now — CPC still feeds the Value score, but is NO LONGER a hard gate
                               # (so high-ticket / lower-CPC niches like weddings still qualify).

  # --- Gate B: per-city demand ---
  min_city_volume: 100         # aggregate monthly searches (all keywords) a city must clear to advance to Tier-2

  # --- CPC display only: metro-tier multiplier (per-city CPC is NOT reliable; this just
  #      re-creates the real big-vs-small-market spread for display, off the national number) ---
  metro_multipliers:
    large: 1.7                 # population >= 250k
    mid: 1.0                   # 60k–250k
    small: 0.8                 # < 60k

  # --- Composite opportunity score weights (must sum to 1.0) ---
  weights:
    rankability: 0.40          # "can I actually rank here?" — dominates for rank-and-rent
    demand: 0.30               # search volume
    value: 0.30                # click/lead value

  # --- Normalization reference points ---
  volume_ref: 5000             # a city hitting this monthly volume scores ~100 on demand
  cpc_ref: 20.0                # a niche at this CPC scores ~100 on value

  # --- Rent-potential ($/mo) model — turns the score into a dollar figure ---
  lead_model:
    click_through_rate: 0.15   # share of searchers who click our ranked result
    lead_conversion: 0.05      # share of clicks that become a real lead
    close_rate: 0.25           # share of leads the contractor closes
    margin: 0.40               # contractor's margin on a job

  # --- Verdict bands (composite score) ---
  verdict_bands:
    go: 70                     # >= 70  -> GO
    maybe: 45                  # 45–69  -> MAYBE ;  < 45 -> AVOID

# ============================================================================
#  REGION PRESETS — named city filters you can pick in the dashboard / CLI
# ============================================================================
regions:
  st_george:
    label: "St. George / SW Utah (MVP validation region)"
    states: [UT, NV]
    population_min: 5000       # override: let the small SW-Utah towns in for the MVP
    include_only: [Saint George, St. George, St George, Washington, Hurricane, Cedar City, Ivins, Santa Clara, Mesquite, Kanab]
  utah:
    label: "All Utah cities"
    states: [UT]
  national_25k:
    label: "All US cities 25k+ (~2,000 cities)"
    population_min: 25000

